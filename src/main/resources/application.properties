spring.application.name=reports-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8087}
spring.jpa.open-in-view=false

# RabbitMQ (broker en contenedor Docker, ver docker-compose.yml en la raiz)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:pcmarket}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pcmarket}
# Si un listener falla no se reencola en bucle: 3 intentos (2 s, 4 s) y el mensaje cae a la cola <cola>.dlq.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
# Publisher confirms: el broker avisa si rechaza un mensaje o no hay cola destino (se registra en el log).
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# PDFs en disco local (MVP). Cambiar a S3 es un cambio en ReportService.store().
app.reports.dir=${REPORTS_DIR:reports-pdf}

# Correo: sin SMTP_HOST no se envia (se registra en el log). Ej. Gmail: smtp.gmail.com / 587 / app password.
app.mail.from=${MAIL_FROM:no-reply@pcmarketbuilder.local}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
# En local con Mailpit: SMTP_HOST=localhost SMTP_PORT=1025 SMTP_AUTH=false SMTP_STARTTLS=false
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
# Sin timeouts JavaMail espera para siempre si el SMTP no responde y deja trabado el listener de correo.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
