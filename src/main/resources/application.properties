spring.application.name=reports-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8087}
spring.jpa.open-in-view=false

# RabbitMQ (broker en contenedor Docker, ver docker-compose.yml en la raiz)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:pcmarket}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pcmarket}
# Si un listener falla no se reencola en bucle: 3 intentos y se descarta.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3

# Plazo del agente tecnico para revisar. Pasado el plazo NO se cancela: se avisa al cliente por PDF.
app.inspection.deadline=${INSPECTION_DEADLINE:PT72H}

# PDFs en disco local (MVP). Cambiar a S3 es un cambio en ReportService.store().
app.reports.dir=${REPORTS_DIR:reports-pdf}

# Correo: sin SMTP_HOST no se envia (se registra en el log). Ej. Gmail: smtp.gmail.com / 587 / app password.
app.mail.from=${MAIL_FROM:no-reply@pcmarketbuilder.local}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
