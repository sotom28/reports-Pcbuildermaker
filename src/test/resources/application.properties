spring.application.name=reports-service
spring.datasource.url=jdbc:h2:mem:reports;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Sin broker ni SMTP en los tests.
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.dynamic=false
spring.mail.host=
app.inspection.deadline=PT72H
app.reports.dir=target/test-reports-pdf
